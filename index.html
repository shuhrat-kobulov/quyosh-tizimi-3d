<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Quyosh Tizimi — 3D Sayohat</title>
  <meta name="description" content="Interaktiv 3D Quyosh tizimi: sayyorani bosing — kamera uning yoniga uchib boradi, panelda esa u haqidagi ma'lumotlar chiqadi. O'zbek tilida, brauzerda ishlaydi, hech narsa o'rnatish shart emas." />
  <meta name="author" content="Shukhratbek Qobulov" />
  <meta name="theme-color" content="#04050c" />
  <meta name="color-scheme" content="dark" />
  <link rel="canonical" href="%VITE_SITE_URL%/" />

  <!-- Telegram, Facebook, LinkedIn uchun ko'rinish -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Quyosh Tizimi" />
  <meta property="og:locale" content="uz_UZ" />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:title" content="Quyosh Tizimi — 3D Sayohat" />
  <meta property="og:description" content="Sayyorani bosing — kamera uning yoniga uchib boradi. Interaktiv 3D Quyosh tizimi, o'zbek tilida." />
  <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Quyosh tizimining 3D ko'rinishi: Quyosh va sayyoralar" />

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Quyosh Tizimi — 3D Sayohat" />
  <meta name="twitter:description" content="Interaktiv 3D Quyosh tizimi, o'zbek tilida. Brauzerda ochiladi." />
  <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Sayyora nomlari (3D dan proyeksiya qilinadi) -->
  <div id="labels"></div>

  <!-- Yuklanish ekrani -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-ring"><span></span><span></span><span></span></div>
      <h1>QUYOSH TIZIMI</h1>
      <p id="loader-status">Yulduzlar yoqilmoqda…</p>
      <div class="loader-bar"><i id="loader-fill"></i></div>
    </div>
  </div>

  <!-- Sarlavha -->
  <header id="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <strong>QUYOSH TIZIMI</strong>
        <em>interaktiv 3D sayohat</em>
      </div>
    </div>
    <div class="hint">Sayyorani bosing · sichqoncha bilan aylantiring · g'ildirak = masshtab</div>
  </header>

  <!-- Ma'lumot paneli -->
  <aside id="panel" class="hidden">
    <button id="panel-close" aria-label="Yopish">&times;</button>
    <div class="panel-head">
      <span id="panel-kind">SAYYORA</span>
      <h2 id="panel-name">—</h2>
      <p id="panel-sub">—</p>
    </div>
    <dl id="panel-facts"></dl>
    <div class="panel-note">
      <span>Qiziqarli fakt</span>
      <p id="panel-fact">—</p>
    </div>
  </aside>

  <!-- Boshqaruv paneli -->
  <footer id="controls">
    <div class="row planets" id="planet-nav"></div>
    <div class="row tools">
      <button class="tool" id="btn-overview" title="Umumiy ko'rinish (Esc)">⌂ Umumiy</button>
      <button class="tool active" id="btn-orbits" title="Orbitalar (O)">◎ Orbitalar</button>
      <button class="tool active" id="btn-labels" title="Nomlar (L)">A Nomlar</button>
      <button class="tool" id="btn-pause" title="Vaqtni to'xtatish (Bo'sh joy)">⏸ Pauza</button>
      <label class="speed">
        <span>Tezlik</span>
        <input id="speed" type="range" min="0" max="300" step="1" value="30" />
        <b id="speed-val">1.0×</b>
      </label>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
